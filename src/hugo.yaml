params:
  author: Förderverein freie Infrastruktur
  authorimage: ../assets/images/logo.png
  og_image: ../assets/images/logo.png
  moto: "Freies Netz überall und für alle!"
  description: >-
    Wir haben den Förderverein am 22. November 2015 gegründet,
    um offene Netzwerk-Infrastrukturen im Münsterland zu fördern.
    Dazu gehört zur Zeit vor allem Freifunk, aber wir sind
    bewusst nicht darauf beschränkt.
  disable_theme_toggle: false
  disable_stay_uptodate: true

  p1:
    heading: "Unsere Mission"
    image: "images/pages/our-mission.png"
    content:
      - text: >-
          Unser Schwerpunkt liegt auf Freifunk, einem gemeinschaftlich betriebenen
          WLAN-Netz, das Menschen kostenlosen und unkomplizierten Internetzugang bietet.
          Wir betreiben und erweitern dieses Netz ehrenamtlich -
          in Wohnvierteln, öffentlichen Plätzen und sozialen Einrichtungen.
      - text: >-
          Wir verstehen uns bewusst nicht als reiner Freifunk-Verein.
          Unser Engagement gilt offenen Infrastrukturen in einem breiteren Sinne:
          Dezentralisierung, digitale Teilhabe und eine freie,
          nicht-kommerzielle Vernetzung der Gesellschaft liegen uns am Herzen.

  p2:
    heading: "Wie kann ich unterstützen?"
    content:
      - text: >-
          Du möchtest freie Infrastruktur im Münsterland fördern?
          Mit einer Spende hilfst du uns, neue Router anzuschaffen,
          Serverkosten zu decken und das Freifunk-Netz weiterzubauen.
          Jeder Betrag zählt - und als gemeinnütziger Verein stellen wir gerne eine Spendenquittung aus.
      - text: >-
          Tausch dich mit uns aus! In unserem Zulip-Chat diskutieren wir Technik,
          planen neue Standorte und helfen uns gegenseitig bei Fragen rund um Freifunk und offene Netze.
          Einfach registrieren und mitmachen - ob als stiller Mitleser oder aktiver Mitgestalter.
      - text: >-
          Am liebsten sehen wir dich persönlich bei einem unserer regelmäßigen Treffen.
          Kein Vorwissen nötig - komm einfach vorbei, lern die Leute kennen und schau,
          wie du dich einbringen kannst.
          Termine und Treffpunkte findest du in unserem Forum und Zulip-Chat.
  p3:
    disabled: true
  p4:
    disabled: true
  p5:
    disabled: true

